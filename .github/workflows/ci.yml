name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - hardening/p0-resolution-safety

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Validate RAG metadata
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/validate-rag-metadata-delta.py --rag-root backend/rag --base-ref origin/${{ github.base_ref }}
          else
            python scripts/validate-rag-metadata.py --rag-root backend/rag
          fi
      - name: Test
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service:
          - monitoring-adapter
          - api-gateway
          - alert-intelligence
          - orchestrator
          - context-agent
          - model-router
          - resolution-agent
          - approval-service
          - remediation-engine
          - closure-service
          - ui
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} (backend)
        if: matrix.service != 'ui'
        run: docker build -f deploy/docker/Dockerfile.service -t kaiops/${{ matrix.service }}:${{ github.sha }} .
      - name: Build ui (frontend)
        if: matrix.service == 'ui'
        run: docker build -f deploy/docker/Dockerfile.ui -t kaiops/ui:${{ github.sha }} .

  kube-validate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Validate manifests
        run: kubectl apply --dry-run=client -f k8s/
