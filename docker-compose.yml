    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend/src/remediation-engine
    ports: ["8008:8000"]
    depends_on:
      kafka: { condition: service_healthy }
      mysql: { condition: service_healthy }

  closure-service:
